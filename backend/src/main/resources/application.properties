spring.application.name=mygarage-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:15432/mygarage
spring.datasource.username=${DB_USERNAME:mygarage}
spring.datasource.password=${DB_PASSWORD:mygarage}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.security=DEBUG
# Optional offline test PKI. Use a public test CA certificate only; never a CA private key.
sharing.pki.required=${SHARING_PKI_REQUIRED:false}
sharing.pki.trusted-ca=${SHARING_PKI_TRUSTED_CA:classpath:sharing/no-ca.pem}
